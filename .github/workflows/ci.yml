name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `vite build` only transpiles; it does not type-check. Run tsc explicitly.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The GitHub Pages build (installable app with offline support) must build too.
      - name: Build for GitHub Pages
        run: |
          npm run build:pages
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
